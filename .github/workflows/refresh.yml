name: Refresh dashboard

on:
  schedule:
    # 4:00pm IST = 10:30 UTC, daily
    - cron: "30 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull latest Adjust data and rebuild dashboard
        working-directory: pipeline
        env:
          ADJUST_API_TOKEN: ${{ secrets.ADJUST_API_TOKEN }}
        run: |
          node fetch_fonts.mjs
          node fetch_all.mjs
          node fetch_daily.mjs
          node fetch_daily_cohort.mjs
          node build_dataset.mjs
          node make_html.mjs

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp pipeline/dashboard_final.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
